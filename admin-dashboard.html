<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOONDO 관리자 로그인</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 20% 0%, rgba(0,224,194,.14), transparent 32%), #05090d;
      color: #f5faf7;
      font-family: Arial, sans-serif;
    }
    .box {
      width: min(360px, calc(100% - 28px));
      padding: 28px;
      border-radius: 18px;
      background: #101820;
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 24px 70px rgba(0,0,0,.45);
    }
    h2 { margin: 0 0 16px; }
    input, button {
      width: 100%;
      height: 44px;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.12);
      padding: 0 12px;
      font-size: 15px;
    }
    input { background: #070c11; color: white; }
    button {
      background: #00e0c2;
      color: #02100e;
      font-weight: 900;
      cursor: pointer;
    }
    .msg { min-height: 18px; margin-top: 12px; color: #ff8b8b; font-size: 13px; }
    a { display: block; margin-top: 14px; color: #aeece4; text-align: center; text-decoration: none; }
  </style>
</head>
<body>
  <div class="box">
    <h2>관리자 로그인</h2>
    <input id="adminId" placeholder="아이디" autocomplete="username">
    <input id="adminPw" type="password" placeholder="비밀번호" autocomplete="current-password">
    <button type="button" id="loginBtn">로그인</button>
    <p id="msg" class="msg"></p>
    <a href="./index.html">일반 대시보드로 이동</a>
  </div>

  <script>
    const ADMIN_ID = 'admin';
    const ADMIN_PW = '1234';

    function login() {
      const id = document.getElementById('adminId').value.trim();
      const pw = document.getElementById('adminPw').value.trim();
      const msg = document.getElementById('msg');

      if (id === ADMIN_ID && pw === ADMIN_PW) {
        localStorage.setItem('admin_login', 'true');
        location.href = './admin-dashboard.html';
        return;
      }

      msg.innerText = '아이디 또는 비밀번호가 틀렸습니다.';
    }

    document.getElementById('loginBtn').addEventListener('click', login);
    document.getElementById('adminPw').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
