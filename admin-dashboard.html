<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>MOONDO123 관리자 대시보드</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>

  <style>
    body {
      background:#081225;
      color:white;
      font-family:Arial, sans-serif;
      padding:30px;
    }
    input, select, button {
      padding:10px;
      margin:4px;
    }
    table {
      width:100%;
      border-collapse:collapse;
      margin-top:20px;
      background:#111c2f;
    }
    th, td {
      border:1px solid #334155;
      padding:10px;
      text-align:center;
    }
    th {
      background:#1e293b;
    }
    .box {
      background:#111c2f;
      padding:20px;
      margin-top:20px;
      border-radius:10px;
    }
    .approve { background:#2563eb; color:white; border:0; cursor:pointer; }
    .reject { background:#dc2626; color:white; border:0; cursor:pointer; }
    .delete { background:#7f1d1d; color:white; border:0; cursor:pointer; }
    .logout { float:right; background:#475569; color:white; border:0; cursor:pointer; }
    a { color:#93c5fd; }
  </style>
</head>

<body>
  <button class="logout" onclick="logout()">로그아웃</button>
  <h1>MOONDO123 관리자 대시보드</h1>
  <p><a href="./index.html">일반 대시보드로 이동</a></p>

  <div class="box">
    <h2>회원 관리</h2>
    <table>
      <thead>
        <tr>
          <th>아이디</th>
          <th>닉네임</th>
          <th>상태</th>
          <th>가입일</th>
          <th>관리</th>
        </tr>
      </thead>
      <tbody id="userList">
        <tr><td colspan="5">불러오는 중...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="box">
    <h2>전적 등록</h2>

    <input id="matchNick" placeholder="닉네임">

    <select id="matchResult">
      <option value="승">승</option>
      <option value="무">무</option>
      <option value="패">패</option>
    </select>

    <input id="scoreFor" type="number" placeholder="득점">
    <input id="scoreAgainst" type="number" placeholder="실점">
    <input id="fcPoint" type="number" placeholder="FC 포인트">

    <button onclick="addMatch()">등록</button>
  </div>

  <div class="box">
    <h2>전적 목록</h2>
    <table>
      <thead>
        <tr>
          <th>닉네임</th>
          <th>결과</th>
          <th>스코어</th>
          <th>FC</th>
          <th>날짜</th>
          <th>관리</th>
        </tr>
      </thead>
      <tbody id="matchList">
        <tr><td colspan="6">불러오는 중...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    if (localStorage.getItem('admin_login') !== 'true') {
      location.href = './admin.html';
    }

    function logout() {
      localStorage.removeItem('admin_login');
      location.href = './admin.html';
    }

    async function loadUsers() {
      const tbody = document.getElementById('userList');

      const { data, error } = await supabaseClient
        .from('app_users')
        .select('*')
        .order('created_at', { ascending:false });

      if (error) {
        tbody.innerHTML = `<tr><td colspan="5">오류 : ${error.message}</td></tr>`;
        return;
      }

      if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5">회원이 없습니다.</td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(user => `
        <tr>
          <td>${user.username || ''}</td>
          <td>${user.nickname || ''}</td>
          <td>${user.status || ''}</td>
          <td>${user.created_at ? new Date(user.created_at).toLocaleString() : ''}</td>
          <td>
            <button class="approve" onclick="updateUserStatus('${user.id}', 'approved')">승인</button>
            <button class="reject" onclick="updateUserStatus('${user.id}', 'rejected')">거절</button>
          </td>
        </tr>
      `).join('');
    }

    async function updateUserStatus(id, status) {
      const { error } = await supabaseClient
        .from('app_users')
        .update({ status })
        .eq('id', id);

      if (error) {
        alert('오류 : ' + error.message);
        return;
      }

      alert(status === 'approved' ? '승인 완료' : '거절 완료');
      loadUsers();
    }

    async function addMatch() {
      const nickname = document.getElementById('matchNick').value.trim();
      const result = document.getElementById('matchResult').value;
      const scoreFor = Number(document.getElementById('scoreFor').value || 0);
      const scoreAgainst = Number(document.getElementById('scoreAgainst').value || 0);
      const fcPoint = Number(document.getElementById('fcPoint').value || 0);

      if (!nickname) {
        alert('닉네임을 입력해주세요.');
        return;
      }

      const { error } = await supabaseClient
        .from('match_history')
        .insert({
          nickname,
          result,
          score_for: scoreFor,
          score_against: scoreAgainst,
          fc_point: fcPoint
        });

      if (error) {
        alert('오류 : ' + error.message);
        return;
      }

      alert('전적 등록 완료');

      document.getElementById('matchNick').value = '';
      document.getElementById('scoreFor').value = '';
      document.getElementById('scoreAgainst').value = '';
      document.getElementById('fcPoint').value = '';

      loadMatches();
    }

    async function loadMatches() {
      const tbody = document.getElementById('matchList');

      const { data, error } = await supabaseClient
        .from('match_history')
        .select('*')
        .order('created_at', { ascending:false });

      if (error) {
        tbody.innerHTML = `<tr><td colspan="6">오류 : ${error.message}</td></tr>`;
        return;
      }

      if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6">전적이 없습니다.</td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(match => `
        <tr>
          <td>${match.nickname || ''}</td>
          <td>${match.result || ''}</td>
          <td>${match.score_for ?? 0} : ${match.score_against ?? 0}</td>
          <td>${match.fc_point || 0}</td>
          <td>${match.created_at ? new Date(match.created_at).toLocaleString() : ''}</td>
          <td>
            <button class="delete" onclick="deleteMatch(${match.id})">삭제</button>
          </td>
        </tr>
      `).join('');
    }

    async function deleteMatch(id) {
      if (!confirm('이 전적을 삭제할까요?')) return;

      const { error } = await supabaseClient
        .from('match_history')
        .delete()
        .eq('id', id);

      if (error) {
        alert('오류 : ' + error.message);
        return;
      }

      alert('삭제 완료');
      loadMatches();
    }

    loadUsers();
    loadMatches();
  </script>
</body>
</html>
