<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>MOONDO123 관리자</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>

  <style>
    body {
      background: #081225;
      color: white;
      font-family: Arial, sans-serif;
      padding: 30px;
    }

    h1 {
      margin-bottom: 25px;
    }

    input {
      width: 180px;
      padding: 12px;
      margin-right: 10px;
      font-size: 15px;
    }

    button {
      padding: 12px 24px;
      font-size: 15px;
      cursor: pointer;
    }

    #result {
      margin-top: 18px;
      color: #ffb4b4;
    }
  </style>
</head>

<body>
  <h1>MOONDO123 관리자</h1>

  <input id="adminId" placeholder="아이디" value="admin">
  <input id="adminPw" type="password" placeholder="비밀번호">
  <button onclick="login()">로그인</button>

  <p id="result"></p>

  <script>
    async function login() {
      const id = document.getElementById('adminId').value.trim();
      const pw = document.getElementById('adminPw').value.trim();
      const result = document.getElementById('result');

      result.innerText = '';

      if (!id || !pw) {
        result.innerText = '아이디와 비밀번호를 입력해주세요.';
        return;
      }

      const { data, error } = await supabaseClient
        .from('admin_users')
        .select('*')
        .eq('username', id)
        .eq('password', pw)
        .maybeSingle();

      if (error) {
        console.error(error);
        result.innerText = '오류 : ' + error.message;
        return;
      }

      if (!data) {
        result.innerText = '아이디 또는 비밀번호가 틀렸습니다.';
        return;
      }

      localStorage.setItem('admin_login', 'true');
      alert('로그인 성공');
      location.href = './index.html';
    }
  </script>
</body>
</html>
