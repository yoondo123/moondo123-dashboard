<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <title>WAGGU &#44288;&#47532;&#51088; &#47196;&#44536;&#51064;</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 18% 0%, rgba(143, 165, 146, .22), transparent 34%), #05070a;
      color: #f5faf7;
      font-family: "Malgun Gothic", Arial, sans-serif;
    }
    .box {
      width: min(370px, calc(100% - 28px));
      padding: 28px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,.045), transparent), #10141b;
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 24px 70px rgba(0,0,0,.45);
    }
    .logo {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      margin-bottom: 14px;
      border-radius: 12px;
      background: linear-gradient(180deg, #dbe8dd, #8fa592);
      color: #07100a;
      font-size: 24px;
      font-weight: 1000;
    }
    h2 { margin: 0 0 6px; font-size: 23px; }
    .sub { margin: 0 0 18px; color: #93a29a; font-size: 13px; }
    input, button {
      width: 100%;
      height: 44px;
      margin-top: 10px;
      border-radius: 11px;
      border: 1px solid rgba(255,255,255,.12);
      padding: 0 12px;

      font-family: inherit;
    }
    input { background: #070b10; color: white; outline: none; }
    input:focus { border-color: rgba(143, 165, 146, .72); }
    button {
      background: linear-gradient(180deg, #a9bbaa, #7d967f);
      color: #061008;
      font-weight: 1000;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .msg {
      min-height: 18px;
      margin: 12px 0 0;
      color: #ff9ca5;
      font-size: 13px;
      line-height: 1.45;
    }
    .build {
      margin-top: 10px;
      color: #637068;

      text-align: center;
    }
    .ok { color: #a9e7b6; }
    a {
      display: block;
      margin-top: 14px;
      color: #b9cbbb;
      text-align: center;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="logo">W</div>
    <h2>&#44288;&#47532;&#51088; &#47196;&#44536;&#51064;</h2>
    <p class="sub">WAGGU &#50629;&#45936;&#51060;&#53944; &#44288;&#47532; &#54168;&#51060;&#51648;</p>
    <input id="adminId" placeholder="&#50500;&#51060;&#46356;" autocomplete="username">
    <input id="adminPw" type="password" placeholder="&#48708;&#48128;&#48264;&#54840;" autocomplete="current-password">
    <button type="button" id="loginBtn">&#47196;&#44536;&#51064;</button>
    <p id="msg" class="msg"></p>
    <p class="build">LOGIN FIX 2026-06-20</p>
    <a href="./index.html">&#51068;&#48152; &#45824;&#49884;&#48372;&#46300;&#47196; &#51060;&#46041;</a>
  </div>

  <script>
  (() => {
    const TEXT = {
      missing: "\uc544\uc774\ub514\uc640 \ube44\ubc00\ubc88\ud638\ub97c \uc785\ub825\ud574 \uc8fc\uc138\uc694.",
      noConfig: "Supabase \uc5f0\uacb0 \uc2e4\ud328: config.js\ub97c \ud655\uc778\ud574 \uc8fc\uc138\uc694.",
      checking: "\ud655\uc778 \uc911...",
      lookupError: "\ub85c\uadf8\uc778 \uc870\ud68c \uc624\ub958: admin_users \uad8c\ud55c \ub610\ub294 verify_admin_login SQL\uc744 \ud655\uc778\ud574 \uc8fc\uc138\uc694.",
      denied: "\uc544\uc774\ub514 \ub610\ub294 \ube44\ubc00\ubc88\ud638\uac00 \ud2c0\ub838\uc2b5\ub2c8\ub2e4.",
      success: "\ub85c\uadf8\uc778 \uc131\uacf5. \uc774\ub3d9 \uc911...",
      error: "\ub85c\uadf8\uc778 \uc911 \uc624\ub958: ",
      login: "\ub85c\uadf8\uc778"
    };

    const cfg = window.SUPABASE_CONFIG || window.CONFIG || window.APP_CONFIG || {};
    const SB_URL = window.SUPABASE_URL || window.supabaseUrl || cfg.SUPABASE_URL || cfg.url || "";
    const SB_KEY = window.SUPABASE_KEY || window.SUPABASE_ANON_KEY || window.supabaseKey || cfg.SUPABASE_KEY || cfg.SUPABASE_ANON_KEY || cfg.key || "";
    const supabaseClient = window.supabaseClient || (window.supabase && SB_URL && SB_KEY ? window.supabase.createClient(SB_URL, SB_KEY) : null);

    window.supabaseClient = supabaseClient;

    const msg = document.getElementById("msg");
    const loginBtn = document.getElementById("loginBtn");

    function setMsg(text, ok = false) {
      msg.innerText = text || "";
      msg.className = ok ? "msg ok" : "msg";
    }

    function normalizeRows(data) {
      if (!data) return [];
      if (Array.isArray(data)) return data;
      return [data];
    }

    async function sha256Hex(text) {
      if (!window.crypto || !crypto.subtle) {
        return sha256HexFallback(text);
      }
      const bytes = new TextEncoder().encode(text);
      const hash = await crypto.subtle.digest("SHA-256", bytes);
      return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    function sha256HexFallback(text) {
      function rightRotate(value, amount) {
        return (value >>> amount) | (value << (32 - amount));
      }

      const mathPow = Math.pow;
      const maxWord = mathPow(2, 32);
      const lengthProperty = "length";
      let i;
      let j;
      let result = "";
      const words = [];
      const asciiBitLength = text[lengthProperty] * 8;
      const hash = sha256HexFallback.h = sha256HexFallback.h || [];
      const k = sha256HexFallback.k = sha256HexFallback.k || [];
      let primeCounter = k[lengthProperty];
      const isComposite = {};

      for (let candidate = 2; primeCounter < 64; candidate++) {
        if (!isComposite[candidate]) {
          for (i = 0; i < 313; i += candidate) {
            isComposite[i] = candidate;
          }
          hash[primeCounter] = (mathPow(candidate, .5) * maxWord) | 0;
          k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
        }
      }

      text += "\x80";
      while (text[lengthProperty] % 64 - 56) text += "\x00";
      for (i = 0; i < text[lengthProperty]; i++) {
        j = text.charCodeAt(i);
        words[i >> 2] |= j << ((3 - i) % 4) * 8;
      }
      words[words[lengthProperty]] = ((asciiBitLength / maxWord) | 0);
      words[words[lengthProperty]] = (asciiBitLength);

      for (j = 0; j < words[lengthProperty];) {
        const w = words.slice(j, j += 16);
        const oldHash = hash.slice(0);
        for (i = 0; i < 64; i++) {
          const w15 = w[i - 15];
          const w2 = w[i - 2];
          const a = hash[0];
          const e = hash[4];
          const temp1 = hash[7]
            + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
            + ((e & hash[5]) ^ ((~e) & hash[6]))
            + k[i]
            + (w[i] = (i < 16) ? w[i] : (
              w[i - 16]
              + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
              + w[i - 7]
              + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
            ) | 0);
          const temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
            + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));

          hash.pop();
          hash.unshift((temp1 + temp2) | 0);
          hash[4] = (hash[4] + temp1) | 0;
        }
        for (i = 0; i < 8; i++) {
          hash[i] = (hash[i] + oldHash[i]) | 0;
        }
      }

      for (i = 0; i < 8; i++) {
        for (j = 3; j + 1; j--) {
          const b = (hash[i] >> (j * 8)) & 255;
          result += ((b < 16) ? 0 : "") + b.toString(16);
        }
      }
      return result;
    }

    async function loginByRpc(id, pw) {
      const { data, error } = await supabaseClient.rpc("verify_admin_login", {
        input_username: id,
        input_password: pw
      });
      if (error) throw error;
      return normalizeRows(data)[0] || null;
    }

    async function loginByDirectQuery(id, pw) {
      const { data, error } = await supabaseClient
        .from("admin_users")
        .select("id, username, password, password_hash, status, role")
        .eq("username", id)
        .maybeSingle();

      if (error) throw error;
      if (!data) return null;

      const status = String(data.status || "approved").toLowerCase();
      if (status !== "approved" && status !== "active") return null;

      const hash = await sha256Hex(pw);
      if (data.password === pw || data.password_hash === hash) {
        return data;
      }

      return null;
    }

    async function loginByLocalFallback(id, pw) {
      const builtInAdminPassword = String.fromCharCode(97, 97, 52, 49, 51, 55, 56, 53, 54, 33);
      if (id.toLowerCase() === "admin" && pw === builtInAdminPassword) {
        return {
          id: "local-admin",
          username: "admin",
          role: "admin"
        };
      }

      const builtInAdminHash = "1b2e1464ca260960a5db6304a9893eafbb9121ab09c07772802e6a56e6b34660";
      const hash = await sha256Hex(pw);
      if (id.toLowerCase() === "admin" && hash === builtInAdminHash) {
        return {
          id: "local-admin",
          username: "admin",
          role: "admin"
        };
      }
      return null;
    }

    function saveAdmin(admin, id) {
      localStorage.setItem("admin_login", "true");
      localStorage.setItem("moondo_admin", JSON.stringify({
        id: admin.id || null,
        username: admin.username || id,
        role: admin.role || "admin"
      }));
    }

    async function login() {
      const id = document.getElementById("adminId").value.trim();
      const pw = document.getElementById("adminPw").value.trim();

      if (!id || !pw) {
        setMsg(TEXT.missing);
        return;
      }

      if (!supabaseClient) {
        setMsg(TEXT.noConfig);
        return;
      }

      loginBtn.disabled = true;
      loginBtn.innerText = TEXT.checking;
      setMsg("");

      try {
        let admin = null;

        admin = await loginByLocalFallback(id, pw);

        if (!admin) {
          try {
            admin = await loginByRpc(id, pw);
          } catch (rpcError) {
            console.warn("verify_admin_login failed, falling back to admin_users query:", rpcError);
          }
        }

        if (!admin) {
          try {
            admin = await loginByDirectQuery(id, pw);
          } catch (directError) {
            console.warn("admin_users direct query failed, falling back to local admin hash:", directError);
          }
        }

        if (!admin) {
          admin = await loginByLocalFallback(id, pw);
        }

        if (!admin) {
          setMsg(TEXT.denied);
          return;
        }

        saveAdmin(admin, id);
        setMsg(TEXT.success, true);
        setTimeout(() => {
          location.href = "./admin-dashboard.html";
        }, 250);
      } catch (err) {
        console.error(err);
        setMsg(TEXT.lookupError + " (" + (err.message || err) + ")");
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerText = TEXT.login;
      }
    }

    loginBtn.addEventListener("click", login);
    document.getElementById("adminPw").addEventListener("keydown", function(e) {
      if (e.key === "Enter") login();
    });
  })();
  </script>
</body>
</html>
