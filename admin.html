<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>MOONDO123 관리자 로그인</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
</head>
<body style="background:#081225;color:white;font-family:Arial;padding:30px;">

  <h1>MOONDO123 관리자</h1>

  <input id="adminId" placeholder="아이디" value="admin">
  <input id="adminPw" type="password" placeholder="비밀번호">
  <button onclick="login()">로그인</button>

  <p id="result" style="color:#ffb4b4;"></p>

  <script>
    async function sha256(text) {
      const bytes = new TextEncoder().encode(text);
      const hash = await crypto.subtle.digest('SHA-256', bytes);
      return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function login() {
      const id = document.getElementById('adminId').value.trim();
      const pw = document.getElementById('adminPw').value.trim();
      const result = document.getElementById('result');
      const passwordHash = await sha256(pw);

      const { data, error } = await supabaseClient
        .from('admin_users')
        .select('*')
        .eq('username', id)
        .eq('password_hash', passwordHash)
        .eq('status', 'approved')
        .limit(1);

      if (error) {
        result.innerText = '오류 : ' + error.message;
        return;
      }

      if (!data || data.length === 0) {
        result.innerText = '아이디 또는 비밀번호가 틀렸습니다.';
        return;
      }

      localStorage.setItem('admin_login', 'true');
      location.href = './admin-dashboard.html';
    }
  </script>

</body>
