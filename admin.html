<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WAGGU 관리자 로그인</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 18% 0%, rgba(143, 165, 146, .22), transparent 34%), #05070a;
      color: #f5faf7;
      font-family: "Malgun Gothic", Arial, sans-serif;
    }
    .box {
      width: min(370px, calc(100% - 28px));
      padding: 28px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,.045), transparent), #10141b;
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 24px 70px rgba(0,0,0,.45);
    }
    .logo {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      margin-bottom: 14px;
      border-radius: 12px;
      background: linear-gradient(180deg, #dbe8dd, #8fa592);
      color: #07100a;
      font-size: 24px;
      font-weight: 1000;
    }
    h2 { margin: 0 0 6px; font-size: 23px; }
    .sub { margin: 0 0 18px; color: #93a29a; font-size: 13px; }
    input, button {
      width: 100%;
      height: 44px;
      margin-top: 10px;
      border-radius: 11px;
      border: 1px solid rgba(255,255,255,.12);
      padding: 0 12px;
      font-size: 15px;
      font-family: inherit;
    }
    input { background: #070b10; color: white; outline: none; }
    input:focus { border-color: rgba(143, 165, 146, .72); }
    button {
      background: linear-gradient(180deg, #a9bbaa, #7d967f);
      color: #061008;
      font-weight: 1000;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .msg {
      min-height: 18px;
      margin: 12px 0 0;
      color: #ff9ca5;
      font-size: 13px;
      line-height: 1.45;
    }
    .ok { color: #a9e7b6; }
    a {
      display: block;
      margin-top: 14px;
      color: #b9cbbb;
      text-align: center;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="logo">W</div>
    <h2>관리자 로그인</h2>
    <p class="sub">WAGGU 업데이트 관리 페이지</p>
    <input id="adminId" placeholder="아이디" autocomplete="username">
    <input id="adminPw" type="password" placeholder="비밀번호" autocomplete="current-password">
    <button type="button" id="loginBtn">로그인</button>
    <p id="msg" class="msg"></p>
    <a href="./index.html">일반 대시보드로 이동</a>
  </div>

  <script>
    const cfg = window.SUPABASE_CONFIG || window.CONFIG || window.APP_CONFIG || {};
    const SB_URL =
      window.SUPABASE_URL ||
      window.supabaseUrl ||
      cfg.SUPABASE_URL ||
      cfg.url ||
      '';

    const SB_KEY =
      window.SUPABASE_KEY ||
      window.SUPABASE_ANON_KEY ||
      window.supabaseKey ||
      cfg.SUPABASE_KEY ||
      cfg.SUPABASE_ANON_KEY ||
      cfg.key ||
      '';

    const supabaseClient =
      window.supabaseClient ||
      (window.supabase && SB_URL && SB_KEY
        ? window.supabase.createClient(SB_URL, SB_KEY)
        : null);

    window.supabaseClient = supabaseClient;

    const msg = document.getElementById('msg');
    const loginBtn = document.getElementById('loginBtn');

    function setMsg(text, ok = false) {
      msg.innerText = text || '';
      msg.className = ok ? 'msg ok' : 'msg';
    }

    function normalizeRows(data) {
      if (!data) return [];
      if (Array.isArray(data)) return data;
      return [data];
    }

    async function login() {
      const id = document.getElementById('adminId').value.trim();
      const pw = document.getElementById('adminPw').value;

      if (!id || !pw) {
        setMsg('아이디와 비밀번호를 입력해 주세요.');
        return;
      }

      if (!supabaseClient) {
        setMsg('Supabase 연결 실패: config.js를 확인해 주세요.');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.innerText = '확인 중...';
      setMsg('');

      try {
        const { data, error } = await supabaseClient.rpc('verify_admin_login', {
          input_username: id,
          input_password: pw
        });

        if (error) {
          console.error(error);
          setMsg('로그인 조회 오류: verify_admin_login SQL 함수를 확인해 주세요.');
          return;
        }

        const rows = normalizeRows(data);
        if (!rows.length) {
          setMsg('아이디 또는 비밀번호가 틀렸습니다.');
          return;
        }

        const admin = rows[0];
        localStorage.setItem('admin_login', 'true');
        localStorage.setItem('moondo_admin', JSON.stringify({
          id: admin.id || null,
          username: admin.username || id,
          role: admin.role || 'admin'
        }));

        setMsg('로그인 성공. 이동 중...', true);
        setTimeout(() => {
          location.href = './admin-dashboard.html';
        }, 250);
      } catch (err) {
        console.error(err);
        setMsg('로그인 중 오류: ' + err.message);
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerText = '로그인';
      }
    }

    loginBtn.addEventListener('click', login);
    document.getElementById('adminPw').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
