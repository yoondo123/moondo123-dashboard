<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>관리자 로그인</title>
  <style>
    body {
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:#05090d;
      color:white;
      font-family:Arial, sans-serif;
    }
    .box {
      width:320px;
      padding:28px;
      border-radius:18px;
      background:#101820;
      border:1px solid rgba(255,255,255,.12);
    }
    input, button {
      width:100%;
      height:42px;
      margin-top:10px;
      border-radius:10px;
      border:0;
      padding:0 12px;
      box-sizing:border-box;
    }
    button {
      background:#00e0c2;
      font-weight:bold;
      cursor:pointer;
    }
    .msg {
      margin-top:12px;
      color:#ff8b8b;
      font-size:13px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>관리자 로그인</h2>

    <input id="adminId" placeholder="아이디">
    <input id="adminPw" type="password" placeholder="비밀번호">

    <button onclick="login()">로그인</button>
    <p id="msg" class="msg"></p>
  </div>

  <script>
    function login() {
      const id = document.getElementById('adminId').value.trim();
      const pw = document.getElementById('adminPw').value.trim();

      if (id === 'admin' && pw === '1234') {
        localStorage.setItem('admin_login', 'true');
        location.href = './admin-dashboard.html';
      } else {
        document.getElementById('msg').innerText = '아이디 또는 비밀번호가 틀렸습니다.';
      }
    }
  </script>
</body>
</html>
