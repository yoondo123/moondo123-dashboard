<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOONDO 관리자 로그인</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 20% 0%, rgba(0,224,194,.14), transparent 32%), #05090d;
      color: #f5faf7;
      font-family: Arial, sans-serif;
    }
    .box {
      width: min(360px, calc(100% - 28px));
      padding: 28px;
      border-radius: 18px;
      background: #101820;
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 24px 70px rgba(0,0,0,.45);
    }
    h2 { margin: 0 0 16px; }
    input, button {
      width: 100%;
      height: 44px;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.12);
      padding: 0 12px;
      font-size: 15px;
    }
    input { background: #070c11; color: white; }
    button {
      background: #00e0c2;
      color: #02100e;
      font-weight: 900;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .msg { min-height: 18px; margin-top: 12px; color: #ff8b8b; font-size: 13px; }
    .ok { color: #8dffd8; }
    a { display: block; margin-top: 14px; color: #aeece4; text-align: center; text-decoration: none; }
  </style>
</head>
<body>
  <div class="box">
    <h2>관리자 로그인</h2>
    <input id="adminId" placeholder="아이디" autocomplete="username">
    <input id="adminPw" type="password" placeholder="비밀번호" autocomplete="current-password">
    <button type="button" id="loginBtn">로그인</button>
    <p id="msg" class="msg"></p>
    <a href="./index.html">일반 대시보드로 이동</a>
  </div>

  <script>
    const SB_URL =
      window.SUPABASE_URL ||
      (typeof SUPABASE_URL !== 'undefined' ? SUPABASE_URL : '');

    const SB_KEY =
      window.SUPABASE_KEY ||
      window.SUPABASE_ANON_KEY ||
      (typeof SUPABASE_KEY !== 'undefined' ? SUPABASE_KEY : '') ||
      (typeof SUPABASE_ANON_KEY !== 'undefined' ? SUPABASE_ANON_KEY : '');

    const supabaseClient =
      window.supabaseClient ||
      (window.supabase && SB_URL && SB_KEY ? window.supabase.createClient(SB_URL, SB_KEY) : null);

    window.supabaseClient = supabaseClient;

    const msg = document.getElementById('msg');
    const loginBtn = document.getElementById('loginBtn');

    function setMsg(text, ok = false) {
      msg.innerText = text || '';
      msg.className = ok ? 'msg ok' : 'msg';
    }

    async function login() {
      const id = document.getElementById('adminId').value.trim();
      const pw = document.getElementById('adminPw').value.trim();

      if (!id || !pw) {
        setMsg('아이디와 비밀번호를 입력해 주세요.');
        return;
      }

      if (!supabaseClient) {
        setMsg('Supabase 연결 실패: config.js를 확인해 주세요.');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.innerText = '확인 중...';
      setMsg('');

      try {
        const { data, error } = await supabaseClient
          .from('admin_users')
          .select('id, username, status, password')
          .eq('username', id)
          .eq('password', pw)
          .eq('status', 'approved')
          .maybeSingle();

        if (error) {
          console.error(error);
          setMsg('로그인 조회 오류: ' + error.message);
          return;
        }

        if (!data) {
          setMsg('아이디 또는 비밀번호가 틀렸습니다.');
          return;
        }

        localStorage.setItem('admin_login', 'true');
        localStorage.setItem('moondo_admin', JSON.stringify({
          id: data.id,
          username: data.username,
          role: 'admin'
        }));

        setMsg('로그인 성공. 이동 중...', true);
        location.href = './admin-dashboard.html';
      } catch (err) {
        console.error(err);
        setMsg('로그인 중 오류: ' + err.message);
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerText = '로그인';
      }
    }

    loginBtn.addEventListener('click', login);
    document.getElementById('adminPw').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
