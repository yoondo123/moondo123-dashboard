<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>MOONDO123 관리자 대시보드</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>

  <style>
    body {
      background: #081225;
      color: white;
      font-family: Arial, sans-serif;
      padding: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 25px;
      background: #111c2f;
    }

    th, td {
      border: 1px solid #334155;
      padding: 12px;
      text-align: center;
    }

    th {
      background: #1e293b;
    }

    button {
      padding: 8px 14px;
      margin: 3px;
      cursor: pointer;
    }

    .approve {
      background: #2563eb;
      color: white;
      border: none;
    }

    .reject {
      background: #dc2626;
      color: white;
      border: none;
    }

    .logout {
      background: #475569;
      color: white;
      border: none;
      float: right;
    }
  </style>
</head>

<body>
  <button class="logout" onclick="logout()">로그아웃</button>

  <h1>MOONDO123 관리자 대시보드</h1>
  <p>회원가입 신청 목록</p>

  <table>
    <thead>
      <tr>
        <th>아이디</th>
        <th>닉네임</th>
        <th>상태</th>
        <th>가입일</th>
        <th>관리</th>
      </tr>
    </thead>
    <tbody id="userList">
      <tr>
        <td colspan="5">불러오는 중...</td>
      </tr>
    </tbody>
  </table>

  <script>
    if (localStorage.getItem('admin_login') !== 'true') {
      location.href = './admin.html';
    }

    async function loadUsers() {
      const tbody = document.getElementById('userList');

      const { data, error } = await supabaseClient
        .from('app_users')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error(error);
        tbody.innerHTML = `
          <tr>
            <td colspan="5">오류 : ${error.message}</td>
          </tr>
        `;
        return;
      }

      if (!data || data.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5">회원가입 신청이 없습니다.</td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = data.map(user => `
        <tr>
          <td>${user.username || ''}</td>
          <td>${user.nickname || ''}</td>
          <td>${user.status || ''}</td>
          <td>${user.created_at ? new Date(user.created_at).toLocaleString() : ''}</td>
          <td>
            <button class="approve" onclick="updateStatus('${user.id}', 'approved')">승인</button>
            <button class="reject" onclick="updateStatus('${user.id}', 'rejected')">거절</button>
          </td>
        </tr>
      `).join('');
    }

    async function updateStatus(id, status) {
      const { error } = await supabaseClient
        .from('app_users')
        .update({ status: status })
        .eq('id', id);

      if (error) {
        alert('오류 : ' + error.message);
        console.error(error);
        return;
      }

      alert(status === 'approved' ? '승인 완료' : '거절 완료');
      loadUsers();
    }

    function logout() {
      localStorage.removeItem('admin_login');
      location.href = './admin.html';
    }

    loadUsers();
  </script>
</body>
</html>
